<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Заявка на кофе в одном из двух филиалов «Механики Кофе» в Брянске.">
    <title>Заявка на кофе — Механика Кофе</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body id="top">
    <header class="site-header"><div class="site-header__inner">
      <a class="site-logo" href="index.html" aria-label="Механика Кофе — главная"><span>Механика</span><span>Кофе</span></a>
      <nav class="site-nav" aria-label="Основная навигация"><ul class="site-nav__list"><li><a class="site-nav__link" href="index.html">Главная</a></li><li><a class="site-nav__link" href="catalog.html">Кофейная карта</a></li><li><a class="site-nav__link" href="contacts.html">Адреса</a></li></ul></nav>
      <a class="header-order" href="order.html" aria-current="page">Оставить заявку <span aria-hidden="true">↗</span></a>
    </div></header>
    <main>
      <div class="page-shell breadcrumbs"><a href="index.html">Главная</a><span aria-hidden="true">/</span><span aria-current="page">Заявка</span></div>
      <section class="page-intro page-shell" aria-labelledby="page-title"><h1 id="page-title">Заявка</h1><p>Выберите напиток и кофейню, оставьте контакты.</p></section>
      <div class="page-shell form-layout">
        <form class="order-form" id="order-form">
          <div class="form-grid">
            <div class="form-field"><label for="order-name">Как к вам обращаться <span aria-hidden="true">*</span></label><input id="order-name" name="name" autocomplete="name" required></div>
            <div class="form-field"><label for="order-email">E-mail <span aria-hidden="true">*</span></label><input id="order-email" name="email" type="email" autocomplete="email" required></div>
            <div class="form-field"><label for="order-phone">Телефон <span aria-hidden="true">*</span></label><input id="order-phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__" required></div>
            <div class="form-field"><label for="order-drink">Кофе <span aria-hidden="true">*</span></label><select id="order-drink" name="drink" required><option value="">Выберите напиток</option><option value="cappuccino">Капучино</option><option value="hvoynaya">Хвойная джезва</option><option value="hazelnut">Ореховый кофе</option></select></div>
            <div class="form-field"><label for="order-branch">Адрес <span aria-hidden="true">*</span></label><select id="order-branch" name="branch" required><option value="">Выберите адрес</option><option value="kuibysheva">Куйбышева, 13</option><option value="voystrochenko">им. А. Ф. Войстроченко, 1</option></select></div>
            <div class="form-field form-field--wide"><label for="order-comment">Комментарий <span class="field-optional">необязательно</span></label><textarea id="order-comment" name="comment" rows="3"></textarea></div>
            <label class="checkbox-field form-field--wide"><input name="consent" type="checkbox" required><span>Даю согласие на обработку персональных данных</span></label>
            <div class="form-actions form-field--wide"><button class="button" type="submit">Отправить заявку</button><p class="form-note">Поля со звёздочкой обязательны</p></div>
          </div>
        </form>
      </div>
    </main>
    <footer class="site-footer"><div class="page-shell site-footer__inner"><a class="site-logo site-logo--footer" href="index.html"><span>Механика</span><span>Кофе</span></a><nav class="site-footer__links" aria-label="Навигация в подвале"><a href="catalog.html">Кофейная карта</a><a href="product.html">Хвойная джезва</a><a href="order.html">Заявка</a><a href="contacts.html">Адреса</a></nav><small>© Механика Кофе</small></div></footer>
    <script src="js/main.js" defer></script>
  </body>
</html>
